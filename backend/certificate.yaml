AWSTemplateFormatVersion: '2010-09-09'
Description: WGO — TLS certificate for the custom domain. Must be deployed to us-east-1 (a CloudFront requirement).

Parameters:
  DomainName:
    Type: String
    Description: The custom domain, e.g. wgo.example.com
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone of the domain; the DNS validation record is created there automatically.

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

Outputs:
  CertificateArn:
    Value: !Ref Certificate
