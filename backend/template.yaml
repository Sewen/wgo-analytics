AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: WGO (What's going on?) — product analytics + OpenTelemetry backend (Aurora DSQL, API Gateway, Lambda, Cognito)

Parameters:
  DeletionProtection:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Enable deletion protection on the DSQL cluster (recommended for production).
  AllowSelfSignup:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Let anyone create an account from the dashboard. If false, create users in Cognito yourself.
  SchemaVersion:
    Type: String
    Default: '1'
    Description: Bump to force the schema migration to re-run.
  CustomDomain:
    Type: String
    Default: ''
    Description: Optional domain for the dashboard, SDK and ingest (e.g. wgo.example.com). Requires CertificateArn.
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate for CustomDomain, in us-east-1 (CloudFront requirement). scripts/deploy.sh creates one for you.
  HostedZoneId:
    Type: String
    Default: ''
    Description: Optional Route 53 hosted zone of CustomDomain. When set, the DNS records are created automatically.
  AllowedEmailDomains:
    Type: String
    Default: ''
    Description: Optional comma-separated email domains allowed to sign up and use the dashboard (e.g. example.com,*.example.org). Empty = anyone.
  SlackClientId:
    Type: String
    Default: ''
    Description: Optional Slack app client id. Enables one-click "Add to Slack" for trigger notifications (scripts/deploy.sh prints a link that creates the app).
  SlackClientSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: Client secret of that Slack app.
  EnableMcp:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Serve the MCP server at /mcp. Turns on Cognito MCP auth (open dynamic client registration) so MCP clients can register themselves; users still sign in with their WGO account.
  MaxRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 3650
    Description: Upper limit for the raw-data retention project owners can choose in Settings (default retention is 14 days). Raw data is what the Aurora DSQL storage bill grows with.
  ClusterMetricsProjectId:
    Type: String
    Default: ''
    Description: Optional project id that receives hourly Aurora DSQL metrics (wgo.dsql.storage_bytes, wgo.dsql.dpu) and a wgo.cluster event you can create triggers on.

Conditions:
  SignupDisabled: !Equals [!Ref AllowSelfSignup, 'false']
  HasCustomDomain: !Not [!Equals [!Ref CustomDomain, '']]
  HasHostedZone: !And [!Condition HasCustomDomain, !Not [!Equals [!Ref HostedZoneId, '']]]
  HasEmailAllowlist: !Not [!Equals [!Ref AllowedEmailDomains, '']]

Rules:
  CustomDomainNeedsCertificate:
    RuleCondition: !Not [!Equals [!Ref CustomDomain, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref CertificateArn, '']]
        AssertDescription: CustomDomain requires CertificateArn (an ACM certificate in us-east-1). scripts/deploy.sh creates it when the domain's hosted zone is in Route 53.

Mappings:
  CloudFront:
    Managed:
      CachingOptimized: 658327ea-f89d-4fab-a63d-7e88639e58f6
      CachingDisabled: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
      AllViewerExceptHostHeader: b689b0a8-53d0-40ab-baf2-68738e2966ac
      SecurityHeaders: 67f7725c-6f97-4210-82d7-5512b31e9d03
  # API Gateway mapping templates for OtlpApi. Kept on one line: a newline would end up in the SQS form
  # body or in the response. The request body arrives base64-encoded (binary media type */*).
  OtlpVtl:
    Request:
      # SendMessage: body = base64 request body; attribute `meta` = name=value lines (signal, write key,
      # content type), parsed by parseQueuedRequest in src/handlers/otlp.ts
      Template: >-
        Action=SendMessage&MessageBody=$util.urlEncode($input.body)&MessageAttribute.1.Name=meta&MessageAttribute.1.Value.DataType=String&MessageAttribute.1.Value.StringValue=signal%3D$util.urlEncode($input.params().path.get('signal'))#foreach($n in $input.params().header.keySet())#set($ln = $n.toLowerCase())#if($ln == 'content-type' || $ln == 'x-wgo-key' || $ln == 'authorization')%0A$util.urlEncode($ln)%3D$util.urlEncode($input.params().header.get($n))#end#end#set($qk = $input.params().querystring.get('key'))#if("$!qk" != '')%0Akey%3D$util.urlEncode($qk)#end
    Accepted:
      # OTLP: answer in the request's encoding; an empty protobuf response is zero bytes
      Template: >-
        #set($proto = false)#foreach($n in $input.params().header.keySet())#if($n.toLowerCase() == 'content-type' && $input.params().header.get($n).toLowerCase().contains('protobuf'))#set($proto = true)#end#end#if($proto)#set($context.responseOverride.header["Content-Type"] = 'application/x-protobuf')#{else}{}#{end}

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 1024
    Timeout: 15
    Environment:
      Variables:
        DSQL_ENDPOINT: !Sub '${DsqlCluster.Identifier}.dsql.${AWS::Region}.on.aws'
        MAX_RETENTION_DAYS: !Ref MaxRetentionDays
        CONNECTIONS_TABLE: !Ref ConnectionsTable
        ALLOWED_EMAIL_DOMAINS: !Ref AllowedEmailDomains
        NODE_OPTIONS: --enable-source-maps

Resources:
  # ---------------------------------------------------------------- storage
  DsqlCluster:
    Type: AWS::DSQL::Cluster
    Properties:
      DeletionProtectionEnabled: !Ref DeletionProtection
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-analytics'

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: connectionId, AttributeType: S }
        - { AttributeName: projectId, AttributeType: S }
      KeySchema:
        - { AttributeName: connectionId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: ProjectIndex
          KeySchema:
            - { AttributeName: projectId, KeyType: HASH }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---------------------------------------------------------------- accounts
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      # Essentials (or Plus) is required for managed login, resource indicators and dynamic client registration (MCP)
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: !If [SignupDisabled, true, false]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
      LambdaConfig:
        PreSignUp: !If [HasEmailAllowlist, !GetAtt PreSignUpFunction.Arn, !Ref AWS::NoValue]
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your WGO verification code
        EmailMessage: 'Welcome to WGO! Your verification code is {####}'

  # Rejects sign-ups outside AllowedEmailDomains (only deployed when the allowlist is set)
  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Condition: HasEmailAllowlist
    Properties:
      CodeUri: ./
      Handler: presignup.handler
      MemorySize: 256
      Timeout: 5
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handlers/presignup.ts]

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Condition: HasEmailAllowlist
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreSignUpFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: dashboard
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      IdTokenValidity: 1
      AccessTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: hours, AccessToken: hours, RefreshToken: days }
      EnableTokenRevocation: true

  # ---------------------------------------------------------------- MCP auth (Cognito)
  # MCP clients use OAuth 2.1 against Cognito: they register themselves (dynamic client registration), the
  # user signs in on managed login, and the token is bound to the MCP URL with an RFC 8707 resource
  # indicator (it becomes the token's `aud`). Resource indicators and DCR need managed login (version 2).
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      # globally unique per region; the stack id's first segment is lowercase hex. Repeated in McpFunction and
      # the outputs (Ref on this resource isn't the bare prefix).
      Domain: !Sub
        - 'wgo-${Id}'
        - Id: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
      ManagedLoginVersion: 2

  # Identifier = the MCP URL, so `resource=<MCP URL>` and the scope `<MCP URL>/read` belong together.
  # The same URL expression is repeated in McpAuth and the McpUrl output.
  McpResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Name: WGO MCP
      Identifier: !Sub
        - 'https://${Host}/mcp'
        - Host: !If [HasCustomDomain, !Ref CustomDomain, !GetAtt WebDistribution.DomainName]
      Scopes:
        - { ScopeName: read, ScopeDescription: 'Read analytics, traces, logs and metrics of your projects' }

  McpAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: mcpauth.handler
      MemorySize: 256
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action: [cognito-idp:DescribeUserPool, cognito-idp:UpdateUserPool]
              Resource: !GetAtt UserPool.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handlers/mcpauth.ts]

  # Cognito MCP auth: open dynamic client registration (CloudFormation has no property for it yet).
  # CloudFormation's own updates of UserPool may reset it, so every property that changes the pool is
  # repeated here to re-apply it afterwards. Bump PoolConfigVersion when you change UserPool above.
  McpAuth:
    Type: Custom::CognitoMcpAuth
    DependsOn: [UserPoolDomain, McpResourceServer] # DCR needs a managed login domain; allowed scopes must exist
    Properties:
      ServiceToken: !GetAtt McpAuthFunction.Arn
      UserPoolId: !Ref UserPool
      Enabled: !Ref EnableMcp
      AllowedScopes:
        - !Sub
          - 'https://${Host}/mcp/read'
          - Host: !If [HasCustomDomain, !Ref CustomDomain, !GetAtt WebDistribution.DomainName]
      PoolConfigVersion: '1'
      AllowSelfSignup: !Ref AllowSelfSignup
      AllowedEmailDomains: !Ref AllowedEmailDomains

  # ---------------------------------------------------------------- HTTP API (ingest + dashboard API)
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [authorization, content-type, content-encoding, x-wgo-key, x-wgo-device,
                       mcp-protocol-version, mcp-method, mcp-name, mcp-session-id, last-event-id]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        ExposeHeaders: [www-authenticate]
        MaxAge: 86400
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5000
        ThrottlingRateLimit: 2000
      Auth:
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience: [!Ref UserPoolClient]

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: ingest.handler
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          WS_MANAGEMENT_ENDPOINT: !Sub 'https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/live'
          # geo headers are only trusted when CloudFront vouches for them with this value
          EDGE_SECRET: !Select [2, !Split ['/', !Ref AWS::StackId]]
          TRIGGER_FUNCTION: !Ref TriggerFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt TriggerFunction.Arn
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*'
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }
      Events:
        Ingest:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /ingest, Method: POST }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native]
        EntryPoints: [src/handlers/ingest.ts]

  OtlpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: otlp.queueHandler
      MemorySize: 1024
      Timeout: 30
      Environment:
        Variables:
          TRIGGER_FUNCTION: !Ref TriggerFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt TriggerFunction.Arn
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt OtlpQueue.Arn
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native]
        EntryPoints: [src/handlers/otlp.ts]

  # ---------------------------------------------------------------- OTLP intake (no Lambda in the request path)
  # API Gateway writes each OTLP request to SQS and answers right away, so senders never wait for a cold
  # start or for DSQL; this matters most for Lambda senders, which export before every invocation returns.
  # OtlpFunction stores the messages. The write key is checked there: requests with an unknown key are
  # accepted and then dropped (logged), not rejected with 401.
  OtlpQueue:
    Type: AWS::SQS::Queue
    Properties:
      MaximumMessageSize: 1048576 # ~750 KB of request body after base64
      MessageRetentionPeriod: 345600 # 4 days
      VisibilityTimeout: 180 # 6x the consumer timeout
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OtlpDeadLetterQueue.Arn
        maxReceiveCount: 5

  OtlpDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MaximumMessageSize: 1048576
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true

  OtlpApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: apigateway.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: send-to-otlp-queue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt OtlpQueue.Arn

  OtlpApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: otlp
      OpenApiVersion: '3.0'
      EndpointConfiguration: { Type: REGIONAL }
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 5000
          ThrottlingRateLimit: 2000
      DefinitionBody:
        openapi: '3.0.1'
        info: { title: !Sub '${AWS::StackName}-otlp', version: '1' }
        # every body is binary: protobuf, JSON and gzipped JSON all reach the template as base64
        x-amazon-apigateway-binary-media-types: ['*/*']
        paths:
          /v1/{signal}:
            post:
              parameters:
                - { name: signal, in: path, required: true, schema: { type: string } }
              responses:
                '200':
                  description: Queued
                  headers:
                    Content-Type: { schema: { type: string } }
                    Access-Control-Allow-Origin: { schema: { type: string } }
                '400':
                  description: Rejected by SQS (empty, or over the message size limit)
                  headers:
                    Content-Type: { schema: { type: string } }
                    Access-Control-Allow-Origin: { schema: { type: string } }
                '503':
                  description: Could not queue, retry
                  headers:
                    Content-Type: { schema: { type: string } }
                    Access-Control-Allow-Origin: { schema: { type: string } }
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${OtlpQueue.QueueName}'
                credentials: !GetAtt OtlpApiRole.Arn
                contentHandling: CONVERT_TO_TEXT
                passthroughBehavior: never
                requestParameters:
                  integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
                requestTemplates:
                  application/x-protobuf: !FindInMap [OtlpVtl, Request, Template]
                  application/protobuf: !FindInMap [OtlpVtl, Request, Template]
                  application/json: !FindInMap [OtlpVtl, Request, Template]
                responses:
                  default:
                    statusCode: '200'
                    contentHandling: CONVERT_TO_TEXT
                    responseParameters:
                      method.response.header.Content-Type: "'application/json'"
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: !FindInMap [OtlpVtl, Accepted, Template]
                      application/x-protobuf: !FindInMap [OtlpVtl, Accepted, Template]
                  '4\d{2}':
                    statusCode: '400'
                    contentHandling: CONVERT_TO_TEXT
                    responseParameters:
                      method.response.header.Content-Type: "'application/json'"
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: '{"error":"Request rejected: empty, or larger than the queue accepts"}'
                  '5\d{2}':
                    statusCode: '503'
                    contentHandling: CONVERT_TO_TEXT
                    responseParameters:
                      method.response.header.Content-Type: "'application/json'"
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: '{"error":"Could not queue the request, please retry"}'
            # CORS preflight for browser exporters
            options:
              parameters:
                - { name: signal, in: path, required: true, schema: { type: string } }
              responses:
                '204':
                  description: CORS preflight
                  headers:
                    Access-Control-Allow-Origin: { schema: { type: string } }
                    Access-Control-Allow-Methods: { schema: { type: string } }
                    Access-Control-Allow-Headers: { schema: { type: string } }
                    Access-Control-Max-Age: { schema: { type: string } }
              x-amazon-apigateway-integration:
                type: mock
                contentHandling: CONVERT_TO_TEXT # binary media type */* would otherwise break the mock template
                passthroughBehavior: when_no_match
                requestTemplates:
                  application/json: '{"statusCode": 204}'
                responses:
                  default:
                    statusCode: '204'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                      method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
                      method.response.header.Access-Control-Allow-Headers: "'content-type,content-encoding,x-wgo-key'"
                      method.response.header.Access-Control-Max-Age: "'86400'"

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: api.handler
      Environment:
        Variables:
          SLACK_CLIENT_ID: !Ref SlackClientId
          SLACK_CLIENT_SECRET: !Ref SlackClientSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
      Events:
        # explicit methods (not ANY) so CORS preflight OPTIONS never reaches the JWT authorizer
        ApiGet:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/api/{proxy+}', Method: GET, Auth: { Authorizer: Cognito } }
        ApiPost:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/api/{proxy+}', Method: POST, Auth: { Authorizer: Cognito } }
        ApiPatch:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/api/{proxy+}', Method: PATCH, Auth: { Authorizer: Cognito } }
        ApiDelete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/api/{proxy+}', Method: DELETE, Auth: { Authorizer: Cognito } }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native]
        EntryPoints: [src/handlers/api.ts]

  # Trigger notifications: invoked asynchronously by ingest (Lambda retries failed deliveries twice)
  TriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: trigger.handler
      MemorySize: 256
      Timeout: 30
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 900
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native]
        EntryPoints: [src/handlers/trigger.ts]

  # "Add to Slack" OAuth redirect (public: authenticated by the signed state it carries)
  SlackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: slack.handler
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          SLACK_CLIENT_ID: !Ref SlackClientId
          SLACK_CLIENT_SECRET: !Ref SlackClientSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
      Events:
        Callback:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /slack/callback, Method: GET }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native]
        EntryPoints: [src/handlers/slack.ts]

  # Android widget: read-only, authenticated in the function with a device token (no Cognito authorizer)
  WidgetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: widget.handler
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
      Events:
        WidgetGet:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/widget/{proxy+}', Method: GET }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native]
        EntryPoints: [src/handlers/widget.ts]

  # Kiosk screens (wall displays): read-only, authenticated in the function with the kiosk URL's token (no Cognito)
  KioskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: kiosk.handler
      Timeout: 15
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
      Events:
        KioskGet:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/kiosk/{proxy+}', Method: GET }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native]
        EntryPoints: [src/handlers/kiosk.ts]

  # MCP server (/mcp) and its OAuth discovery documents. No API Gateway authorizer: unauthenticated calls must
  # get the 401 + WWW-Authenticate challenge that starts the OAuth flow, so the function verifies tokens.
  # Its public URL comes from the request (CloudFront Function below), not from the distribution: the
  # distribution depends on this API, whose routes depend on this function.
  McpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: mcp.handler
      Timeout: 20
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          COGNITO_DOMAIN: !Sub
            - 'wgo-${Id}.auth.${AWS::Region}.amazoncognito.com' # = UserPoolDomain
            - Id: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
          MCP_ENABLED: !Ref EnableMcp
          EDGE_SECRET: !Select [2, !Split ['/', !Ref AWS::StackId]]
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
            # access tokens carry no email: the user's email is looked up by username
            - Effect: Allow
              Action: cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
      Events:
        McpPost:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /mcp, Method: POST }
        McpGet:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /mcp, Method: GET }
        McpDelete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /mcp, Method: DELETE }
        WellKnown:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/.well-known/{proxy+}', Method: GET }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native]
        EntryPoints: [src/handlers/mcp.ts]

  # ---------------------------------------------------------------- WebSocket API (live updates)
  WsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-live'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  WsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: ws.handler
      Timeout: 10
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*'
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native]
        EntryPoints: [src/handlers/ws.ts]

  WsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsFunction.Arn}/invocations'

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $connect
      Target: !Sub 'integrations/${WsIntegration}'

  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $disconnect
      Target: !Sub 'integrations/${WsIntegration}'

  WsDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $default
      Target: !Sub 'integrations/${WsIntegration}'

  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: [WsConnectRoute, WsDisconnectRoute, WsDefaultRoute]
    Properties:
      ApiId: !Ref WsApi
      StageName: live
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 500
        ThrottlingRateLimit: 100

  WsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*'

  # ---------------------------------------------------------------- maintenance
  # Every 15 minutes: hourly rollups, hourly cluster metrics, daily retention. Each run stops after 12 minutes
  # and resumes next time; no retries, so runs never overlap (no reserved concurrency needed).
  MaintenanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: maintenance.handler
      Timeout: 840
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Environment:
        Variables:
          DSQL_CLUSTER_ID: !GetAtt DsqlCluster.Identifier
          CLUSTER_METRICS_PROJECT_ID: !Ref ClusterMetricsProjectId
          TRIGGER_FUNCTION: !Ref TriggerFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt TriggerFunction.Arn
            # CloudWatch metric reads can't be scoped to a resource
            - Effect: Allow
              Action: [cloudwatch:GetMetricData, cloudwatch:ListMetrics]
              Resource: '*'
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)
            RetryPolicy: { MaximumRetryAttempts: 0 }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native]
        EntryPoints: [src/handlers/maintenance.ts]

  # ---------------------------------------------------------------- schema migration
  MigrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: migrate.handler
      Timeout: 300
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native]
        EntryPoints: [src/handlers/migrate.ts]

  DsqlSchema:
    Type: Custom::DsqlSchema
    Properties:
      ServiceToken: !GetAtt MigrateFunction.Arn
      SchemaVersion: !Ref SchemaVersion
      SchemaHash: '2026-11-16-11' # bump when src/lib/schema.ts changes

  # ---------------------------------------------------------------- dashboard + SDK hosting
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-web'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Ingest + OTLP go through CloudFront too: edge TLS close to users, and free IP geolocation headers.
  IngestOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-ingest'
        Comment: Forward geolocation + the headers ingest and CORS preflights need (max 10)
        CookiesConfig: { CookieBehavior: none }
        QueryStringsConfig: { QueryStringBehavior: all }
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - CloudFront-Viewer-Country
            - CloudFront-Viewer-Country-Region-Name
            - CloudFront-Viewer-City
            - CloudFront-Viewer-Latitude
            - CloudFront-Viewer-Longitude
            - Content-Type
            - X-WGO-Key
            - Origin
            - Access-Control-Request-Method
            - Access-Control-Request-Headers

  # The MCP server must know the URL clients use (its OAuth resource identifier). API Gateway only sees its own
  # host, so this copies the viewer's Host; the function trusts it only next to the edge secret header.
  ForwardHostFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-forward-host'
      AutoPublish: true
      FunctionConfig:
        Comment: Copy Host to x-forwarded-host for the MCP server
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.headers['x-forwarded-host'] = { value: request.headers.host.value };
          return request;
        }

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: WGO dashboard, SDK and ingest
        Aliases: !If [HasCustomDomain, [!Ref CustomDomain], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: X-WGO-Edge
                HeaderValue: !Select [2, !Split ['/', !Ref AWS::StackId]]
          - Id: otlp
            DomainName: !Sub '${OtlpApi}.execute-api.${AWS::Region}.amazonaws.com'
            OriginPath: /otlp
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        # The dashboard uses hash routing, so no SPA error-page rewrites are needed. They would also
        # turn API 403/404 responses on the ingest paths into index.html.
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: !FindInMap [CloudFront, Managed, CachingOptimized]
          ResponseHeadersPolicyId: !FindInMap [CloudFront, Managed, SecurityHeaders]
        CacheBehaviors:
          - PathPattern: /ingest
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !FindInMap [CloudFront, Managed, CachingDisabled]
            OriginRequestPolicyId: !Ref IngestOriginRequestPolicy
            Compress: false
          - PathPattern: /v1/*
            TargetOriginId: otlp
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !FindInMap [CloudFront, Managed, CachingDisabled]
            OriginRequestPolicyId: !Ref IngestOriginRequestPolicy
            Compress: false
          # MCP: needs the Authorization header, which only an all-viewer-headers policy forwards
          - PathPattern: /mcp
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !FindInMap [CloudFront, Managed, CachingDisabled]
            OriginRequestPolicyId: !FindInMap [CloudFront, Managed, AllViewerExceptHostHeader]
            Compress: false
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ForwardHostFunction.FunctionMetadata.FunctionARN
          - PathPattern: /.well-known/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !FindInMap [CloudFront, Managed, CachingDisabled]
            OriginRequestPolicyId: !FindInMap [CloudFront, Managed, AllViewerExceptHostHeader]
            Compress: false
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ForwardHostFunction.FunctionMetadata.FunctionARN

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}'

  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref CustomDomain
          Type: A
          AliasTarget: { DNSName: !GetAtt WebDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } # CloudFront's fixed zone id
        - Name: !Ref CustomDomain
          Type: AAAA
          AliasTarget: { DNSName: !GetAtt WebDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

Outputs:
  DashboardUrl:
    Value: !Sub
      - 'https://${Host}'
      - Host: !If [HasCustomDomain, !Ref CustomDomain, !GetAtt WebDistribution.DomainName]
  IngestUrl:
    Description: SDK endpoint + OTLP base URL (via CloudFront, adds geolocation)
    Value: !Sub
      - 'https://${Host}'
      - Host: !If [HasCustomDomain, !Ref CustomDomain, !GetAtt WebDistribution.DomainName]
  CloudFrontDomain:
    Description: Point a CNAME for CustomDomain here if its DNS is not in Route 53
    Value: !GetAtt WebDistribution.DomainName
  ApiUrl:
    Description: Dashboard API (also accepts /ingest directly, without geolocation)
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  OtlpDeadLetterQueueUrl:
    Description: OTLP requests that failed to store 5 times (DSQL errors). Redrive them to OtlpQueue once fixed.
    Value: !Ref OtlpDeadLetterQueue
  SlackRedirectUrl:
    Description: OAuth redirect URL for the Slack app (the app manifest printed by scripts/deploy.sh includes it)
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/slack/callback'
  WsUrl:
    Value: !Sub 'wss://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/live'
  SdkUrl:
    Value: !Sub
      - 'https://${Host}/sdk/v1/wgo.js'
      - Host: !If [HasCustomDomain, !Ref CustomDomain, !GetAtt WebDistribution.DomainName]
  McpUrl:
    Description: MCP server (Streamable HTTP, OAuth via Cognito MCP auth), e.g. `claude mcp add --transport http wgo <url>`
    Value: !Sub
      - 'https://${Host}/mcp'
      - Host: !If [HasCustomDomain, !Ref CustomDomain, !GetAtt WebDistribution.DomainName]
  CognitoDomain:
    Description: Cognito managed login (the MCP OAuth sign-in page)
    Value: !Sub
      - 'https://wgo-${Id}.auth.${AWS::Region}.amazoncognito.com'
      - Id: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref WebDistribution
  DsqlEndpoint:
    Value: !Sub '${DsqlCluster.Identifier}.dsql.${AWS::Region}.on.aws'
